name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./db/ci.db
      AUTH_SECRET: ci-only-secret-not-for-production-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
