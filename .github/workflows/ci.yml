name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, lint, database migration, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kairu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairu_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations to a clean PostgreSQL database
        run: bun run db:migrate:deploy

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Vercel production build path (generate client, migrate, build)
        run: VERCEL_ENV=production bun run vercel-build
